<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soundboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="now">
      <span class="dot"></span>
      <span id="nowPlaying">Kuch play nahi ho raha</span>
    </div>
    <button id="stopBtn" class="btn stop" type="button">⏹ Stop</button>
  </header>

  <main>
    <section id="foldersSection" hidden>
      <h2>Folders <small>(random sound)</small></h2>
      <div id="folders" class="grid"></div>
    </section>

    <section id="looseSection" hidden>
      <h2>Sounds</h2>
      <div id="loose" class="grid"></div>
    </section>

    <p id="empty" class="empty" hidden>sounds/ folder me koi audio file nahi mili.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
